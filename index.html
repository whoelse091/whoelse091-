  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry

-delay:.45s}\n@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n@media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1}}\n@page{margin:14mm;}\n@media print{\n  :root{--bg:#fff;--card:#fff;--line:#c9c9c9;--text:#000;--muted:#3d3d3d;--accent:#000;}\n  html,body{background:#fff !important;}\n  .page{padding:0 !important;font-size:12.5px !important;}\n  .rise{animation:none !important;opacity:1 !important;}\n  .sec{margin-top:26px !important;break-inside:avoid;}\n  .card{break-inside:avoid;border-color:#c9c9c9 !important;}\n  a{border-bottom:none;color:#000;}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"page\" style=\"padding: 88px 16px 56px; background: var(--bg); color: var(--text); font-family: 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; font-size: 15.5px; line-height: 1.75; min-height: 100vh;\" data-canvas-width=\"1280\" data-canvas-height=\"1900\" data-document-role=\"page\" data-label=\"Resume\">\n<main style=\"max-width: 720px; margin: 0 auto;\">\n\n<header class=\"rise d1\">\n  <p style=\"margin: 0 0 20px; font-family: 'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace; font-size: 12px; letter-spacing: 0.14em; color: var(--accent); line-height: 1.6;\">ELECTRONICS ENGINEER · EMBEDDED · EMC<\u002Fp>\n  <h1 style=\"margin: 0; font-family: 'Newsreader','Source Serif 4',Georgia,serif; font-weight: 400; font-size: clamp(44px, 9vw, 64px); line-height: 1.05; letter-spacing: -0.02em;\">Gelani Suliev<\u002Fh1>\n  <p style=\"margin: 24px 0 0; max-width: 560px; font-size: 18px; line-height: 1.65; color: var(--text);\">I design and build embedded hardware — PCBs, firmware and RF links — and I'm growing into EMC engineering, where measurement decides what's true.<\u002Fp>\n  <p style=\"margin: 28px 0 0; display: flex; flex-wrap: wrap; gap: 6px 28px; font-family: 'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace; font-size: 13px; color: var(--muted); line-height: 1.6;\">\n    <span>Almaty, Kazakhstan<\u002Fspan>\n    <a href=\"mailto:your@email.com\">[your@email.com]<\u002Fa>\n    <a href=\"https://github.com/whoelse091\">github.com/whoelse091<\u002Fa>\n  <\u002Fp>\n<\u002Fheader>\n\n<section class=\"sec rise d2\" style=\"margin-top: 88px;\">\n  <h2 style=\"margin: 0 0 28px; font-family: 'Newsreader','Source Serif 4',Georgia,serif; font-weight: 400; font-size: 30px; line-height: 1.2; letter-spacing: -0.01em;\">Experience<\u002Fh2>\n  <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 24px;\">\n    <h3 style=\"margin: 0; font-family: 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; font-weight: 500; font-size: 17px; line-height: 1.5;\">T-Standard LLP<\u002Fh3>\n    <span style=\"font-family: 'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace; font-size: 12.5px; color: var(--muted); white-space: nowrap;\">Sep 2026 — Present<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"margin: 0 0 18px; color: var(--muted);\">Test Support Technician, EMC Laboratory · Almaty<\u002Fp>\n  <ul class=\"bul\">\n    <li>Verify and prepare the lab's EMC test equipment for acceptance and use, working from the requirements of CISPR 16 and the IEC 61000-4 series.<\u002Fli>\n    <li>Take part in selecting and accepting new equipment, and record what is actually measured, as found.<\u002Fli>\n    <li>Carry out dimensional and electrical measurements on cables and wires for certification testing.<\u002Fli>\n    <li>Prepare test protocols and supporting documentation for the laboratory.<\u002Fli>\n  <\u002Ful>\n<\u002Fsection>\n\n<section class=\"sec rise d3\" style=\"margin-top: 88px;\">\n  <h2 style=\"margin: 0 0 28px; font-family: 'Newsreader','Source Serif 4',Georgia,serif; font-weight: 400; font-size: 30px; line-height: 1.2; letter-spacing: -0.01em;\">Projects<\u002Fh2>\n  <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px;\">\n\n    <article class=\"card\" style=\"background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 12px;\">\n      <h3 style=\"margin: 0; font-family: 'Newsreader','Source Serif 4',Georgia,serif; font-weight: 500; font-size: 21px; line-height: 1.3;\">MAXWELLS0S<\u002Fh3>\n      <p style=\"margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.65;\">GPS and LoRa mesh SOS network for preventing mountain-rescue incidents. Hand-assembled board, field-tested on hikes.<\u002Fp>\n      <p style=\"margin: auto 0 0; padding-top: 4px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: 'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace; font-size: 11.5px; color: var(--muted); line-height: 1.6;\"><span>LoRa 868 MHz<\u002Fspan><span>GPS<\u002Fspan><span>KiCad<\u002Fspan><\u002Fp>\n    <\u002Farticle>\n\n    <article class=\"card\" style=\"background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 12px;\">\n      <h3 style=\"margin: 0; font-family: 'Newsreader','Source Serif 4',Georgia,serif; font-weight: 500; font-size: 21px; line-height: 1.3;\">ESUAVP<\u002Fh3>\n      <p style=\"margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.65;\">Compact GPS and IMU flight-data board built around an ESP32-C3.<\u002Fp>\n      <p style=\"margin: auto 0 0; padding-top: 4px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: 'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace; font-size: 11.5px; color: var(--muted); line-height: 1.6;\"><span>ESP32-C3<\u002Fspan><span>GPS<\u002Fspan><span>IMU<\u002Fspan><\u002Fp>\n    <\u002Farticle>\n\n    <article class=\"card\" style=\"background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 12px;\">\n      <h3 style=\"margin: 0; font-family: 'Newsreader','Source Serif 4',Georgia,serif; font-weight: 500; font-size: 21px; line-height: 1.3;\">Wearable monitor<\u002Fh3>\n      <p style=\"margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.65;\">Wrist-worn wellness device with PPG, EDA, IMU and temperature sensing. Sole hardware developer; prototype built.<\u002Fp>\n      <p style=\"margin: auto 0 0; padding-top: 4px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: 'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace; font-size: 11.5px; color: var(--muted); line-height: 1.6;\"><span>PPG / EDA<\u002Fspan><span>Wearable<\u002Fspan><span>PCB<\u002Fspan><\u002Fp>\n    <\u002Farticle>\n\n    <article class=\"card\" style=\"background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 12px;\">\n      <h3 style=\"margin: 0; font-family: 'Newsreader','Source Serif 4',Georgia,serif; font-weight: 500; font-size: 21px; line-height: 1.3;\">Air purifier retrofit<\u002Fh3>\n      <p style=\"margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.65;\">Digital monitoring and control added to an existing purifier for a university customer. Electronics and 220 V wiring side.<\u002Fp>\n      <p style=\"margin: auto 0 0; padding-top: 4px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: 'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace; font-size: 11.5px; color: var(--muted); line-height: 1.6;\"><span>Mains power<\u002Fspan><span>Relays<\u002Fspan><span>Controller<\u002Fspan><\u002Fp>\n    <\u002Farticle>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec rise d4\" style=\"margin-top: 88px;\">\n  <h2 style=\"margin: 0 0 12px; font-family: 'Newsreader','Source Serif 4',Georgia,serif; font-weight: 400; font-size: 30px; line-height: 1.2; letter-spacing: -0.01em;\">Skills<\u002Fh2>\n  <div>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 2px 24px; padding: 16px 0; border-top: 1px solid var(--line);\">\n      <span style=\"flex: 0 0 160px; font-family: 'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace; font-size: 12.5px; color: var(--muted); line-height: 1.9;\">Hardware<\u002Fspan>\n      <span style=\"flex: 1 1 280px;\">PCB design in KiCad, SMT and BGA soldering, power stages, MSL handling per J-STD-033<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 2px 24px; padding: 16px 0; border-top: 1px solid var(--line);\">\n      <span style=\"flex: 0 0 160px; font-family: 'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace; font-size: 12.5px; color: var(--muted); line-height: 1.9;\">Embedded<\u002Fspan>\n      <span style=\"flex: 1 1 280px;\">C/C++ firmware on STM32 (HAL) and ESP32; RP2350 prototyping<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 2px 24px; padding: 16px 0; border-top: 1px solid var(--line);\">\n      <span style=\"flex: 0 0 160px; font-family: 'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace; font-size: 12.5px; color: var(--muted); line-height: 1.9;\">RF<\u002Fspan>\n      <span style=\"flex: 1 1 280px;\">LoRa at 868 MHz, GPS, antennas, S-parameters and VNA, Smith chart<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 2px 24px; padding: 16px 0; border-top: 1px solid var(--line);\">\n      <span style=\"flex: 0 0 160px; font-family: 'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace; font-size: 12.5px; color: var(--muted); line-height: 1.9;\">EMC<\u002Fspan>\n      <span style=\"flex: 1 1 280px;\">Emission and immunity methods (CISPR 16, IEC 61000-4-2/-3/-4/-6), return paths and common-mode conversion<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 2px 24px; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);\">\n      <span style=\"flex: 0 0 160px; font-family: 'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace; font-size: 12.5px; color: var(--muted); line-height: 1.9;\">Tools<\u002Fspan>\n      <span style=\"flex: 1 1 280px;\">KiCad, oscilloscope, VNA, Python, Git<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec rise d5\" style=\"margin-top: 88px;\">\n  <h2 style=\"margin: 0 0 12px; font-family: 'Newsreader','Source Serif 4',Georgia,serif; font-weight: 400; font-size: 30px; line-height: 1.2; letter-spacing: -0.01em;\">Education<\u002Fh2>\n  <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 24px; padding: 16px 0; border-top: 1px solid var(--line);\">\n    <div style=\"flex: 1 1 320px;\">\n      <div>Automation and Electrical Engineering, B.Sc.<\u002Fdiv>\n      <div style=\"color: var(--muted);\">METU<\u002Fdiv>\n    <\u002Fdiv>\n    <span style=\"font-family: 'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace; font-size: 12.5px; color: var(--muted); white-space: nowrap; line-height: 1.9;\">Expected 2028<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 24px; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);\">\n    <div style=\"flex: 1 1 320px;\">\n      <div>Embedded Systems Technician<\u002Fdiv>\n      <div style=\"color: var(--muted);\">ЦАТЭК, college<\u002Fdiv>\n    <\u002Fdiv>\n    <span style=\"font-family: 'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace; font-size: 12.5px; color: var(--muted); white-space: nowrap; line-height: 1.9;\">2025<\u002Fspan>\n  <\u002Fdiv>\n\n  <h2 style=\"margin: 56px 0 12px; font-family: 'Newsreader','Source Serif 4',Georgia,serif; font-weight: 400; font-size: 30px; line-height: 1.2; letter-spacing: -0.01em;\">Languages<\u002Fh2>\n  <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 24px; padding: 16px 0; border-top: 1px solid var(--line);\">\n    <span>Russian<\u002Fspan>\n    <span style=\"font-family: 'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace; font-size: 12.5px; color: var(--muted); line-height: 1.9;\">Native<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 24px; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);\">\n    <span>English<\u002Fspan>\n    <span style=\"font-family: 'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace; font-size: 12.5px; color: var(--muted); line-height: 1.9;\">Advanced<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"margin-top: 96px; text-align: center; font-family: 'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace; font-size: 12px; color: var(--muted); letter-spacing: 0.06em;\">\n  <a href=\"https://whoelse.tech\">whoelse.tech<\u002Fa>\n<\u002Ffooter>\n\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1900}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {};\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
